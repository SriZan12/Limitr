plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

// Private values stay in the environment or the gitignored root properties file.
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseSigningValues = [
    storeFile: System.getenv('LIMITR_KEYSTORE_FILE') ?: releaseProperties.getProperty('storeFile'),
    storePassword: System.getenv('LIMITR_KEYSTORE_PASSWORD') ?: releaseProperties.getProperty('storePassword'),
    keyAlias: System.getenv('LIMITR_KEY_ALIAS') ?: releaseProperties.getProperty('keyAlias'),
    keyPassword: System.getenv('LIMITR_KEY_PASSWORD') ?: releaseProperties.getProperty('keyPassword')
]

android {
    namespace 'com.khadka.limitr'
    compileSdk 36
    defaultConfig {
        applicationId "com.khadka.Limitr"
        minSdk 23
        targetSdk 36
        versionCode 11
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures { dataBinding true; buildConfig true }
    signingConfigs {
        release {
            if (releaseSigningValues.storeFile) storeFile rootProject.file(releaseSigningValues.storeFile)
            storePassword releaseSigningValues.storePassword
            keyAlias releaseSigningValues.keyAlias
            keyPassword releaseSigningValues.keyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testTemp = layout.buildDirectory.dir('tmp/unit-tests').get().asFile
            systemProperty 'java.io.tmpdir', testTemp.absolutePath
            doFirst { testTemp.mkdirs() }
        }
    }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }
}
kapt { arguments { arg('room.schemaLocation', "$projectDir/schemas") } }

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Require private release signing configuration; never fall back to a debug key.'
    doLast {
        def missing = releaseSigningValues.findAll { key, value -> !value }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Missing release signing fields: ${missing.join(', ')}. Configure keystore.properties or LIMITR_KEYSTORE_FILE/LIMITR_KEYSTORE_PASSWORD/LIMITR_KEY_ALIAS/LIMITR_KEY_PASSWORD. See docs/RELEASE.md.")
        }
        if (!rootProject.file(releaseSigningValues.storeFile).isFile()) {
            throw new GradleException('The configured release keystore file does not exist. See docs/RELEASE.md.')
        }
    }
}
tasks.matching { it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'validateSigningRelease'] }.configureEach {
    dependsOn validateReleaseSigning
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'
    implementation 'com.google.dagger:hilt-android:2.57.2'
    kapt 'com.google.dagger:hilt-android-compiler:2.57.2'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
}
